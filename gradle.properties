# Lets the foojay resolver (applied in settings.gradle.kts) auto-provision
# whichever per-task JDKs the build needs (8 for the Kotlin toolchain, 25 to
# read the Spigot 26.1 API at compile time) instead of requiring them
# preinstalled on every machine that builds this repo.
org.gradle.java.installations.auto-download=true
