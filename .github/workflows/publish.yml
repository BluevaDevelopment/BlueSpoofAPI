name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Verify release
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to repo.blueva.net
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Publish to Blueva Maven repository
        run: |
          ./gradlew publishAllPublicationsToBluevaRepoRepository \
            "-Dorg.gradle.java.home=$JAVA_HOME" \
            --no-daemon --stacktrace
        env:
          BLUEVA_REPO_USERNAME: ${{ secrets.BLUEVA_REPO_USERNAME }}
          BLUEVA_REPO_SECRET: ${{ secrets.BLUEVA_REPO_SECRET }}
